; ============================================================
;  ESP32-C3 + 1.8" ST7735S 160x128 横屏桌面时钟
;  LVGL 8 + LovyanGFX + Web 配网
; ============================================================
;  编译：pio run
;  烧录：pio run -t upload
;  串口：pio device monitor
;
;  说明：ESP32-C3 使用 RISC-V 工具链；首次编译会自动下载。
;  Arduino-ESP32 2.0.14 与 LVGL 8.3.x / LovyanGFX 1.1.x 已验证兼容。
; ============================================================

[platformio]
default_envs = esp32c3

; Windows 下 riscv32-esp-gcc 处理中文路径的 -Map 输出会失败。
; 把编译产物放到一个纯 ASCII 的缓存目录，源码目录仍保持中文名。
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/esp32c3-clock-anim

[env:esp32c3]
platform = espressif32@6.5.0        ; Arduino-ESP32 2.0.14
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; ---- C3：160 MHz，4 MB Flash ----
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv   ; 3 MB 程序区，字体 + Web 页面够用
board_upload.flash_size = 4MB

; ---- 依赖 ----
lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@6.21.5

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    ; 使用 C3 原生 USB 串口（同时保留 UART0，CH340 也能烧录）
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 仅用于开发：把 LVGL 渲染结果从串口导出成 PNG 预览
[env:uidump]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DUI_DUMP=1
