; 纯屏幕自检固件：只依赖 LovyanGFX，不跑 LVGL / WiFi
; 用于排查接线、背光、偏移和颜色顺序。
;
; 用法：
;   cd tools/lcdtest
;   pio run -t upload
;   pio device monitor

[platformio]
default_envs = esp32c3
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/esp32c3-lcdtest-anim

[env:esp32c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps = lovyan03/LovyanGFX@1.1.16

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
